<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow HUD</title>
  <link rel="stylesheet" href="widget.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hud-pill-window drag-region">
    <!-- Pulse dot -->
    <div class="status-indicator" id="hud-indicator"></div>

    <!-- Info -->
    <div class="hud-info no-drag">
      <div class="hud-task-name" id="hud-task-name">Free Focus</div>
      <div class="hud-timer-text" id="hud-timer-text">25:00</div>
    </div>

    <!-- Actions -->
    <div class="hud-controls no-drag">
      <button id="hud-play-btn" class="hud-btn" title="Play / Pause">▶</button>
      <button id="hud-expand-btn" class="hud-btn" title="Open Main Dashboard">↗</button>
      <button id="hud-close-btn" class="hud-btn close" title="Hide HUD">×</button>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
